name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publier, par exemple v3.0.1 (il doit deja exister)"
        required: true
        type: string

permissions:
  contents: write

env:
  # Le tag pousse, ou celui saisi lors d'un lancement manuel.
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Executable Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Un lancement manuel doit compiler le code du tag demande,
          # pas la pointe de la branche courante.
          ref: ${{ env.VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Tests avant publication
        run: |
          ruff check .
          pytest

      - name: Compiler l'executable
        run: pyinstaller --noconfirm --clean scripts/MusicOverlayServer.spec

      - name: Archiver l'executable
        run: Compress-Archive -Path dist/MusicOverlayServer/* -DestinationPath MusicOverlayServer-${{ env.VERSION }}.zip

      - name: Archiver les sources utilisables
        run: |
          $inclus = @('music_overlay', 'skins', 'docs', 'scripts',
                      'launcher.pyw', 'server.py', 'DEMARRER.bat',
                      'pyproject.toml', 'README.md', 'CHANGELOG.md', 'LICENSE')
          Compress-Archive -Path $inclus -DestinationPath MusicOverlayServer-sources-${{ env.VERSION }}.zip

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            MusicOverlayServer-${{ env.VERSION }}.zip
            MusicOverlayServer-sources-${{ env.VERSION }}.zip
          body: |
            ## Music Overlay Server ${{ env.VERSION }}

            **Sans Python** — telechargez `MusicOverlayServer-${{ env.VERSION }}.zip`,
            decompressez, puis lancez `MusicOverlayServer.exe`.

            **Avec Python** — telechargez `MusicOverlayServer-sources-${{ env.VERSION }}.zip`,
            decompressez, puis double-cliquez sur `DEMARRER.bat`.

            Le detail des changements est dans [CHANGELOG.md](CHANGELOG.md).
