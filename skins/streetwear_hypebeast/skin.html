<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Streetwear Marquee Overlay (Final)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ccff00; /* Vert Acide */
            --rec-color: #ff0000;    /* Rouge enregistrement */
            --border-width: 3px;
            --height: 80px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Teko', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: flex-start; /* Collé en haut */
            padding: 20px;
        }

        /* Conteneur Principal */
        .street-container {
            display: flex;
            width: 500px;
            height: var(--height);
            background: var(--bg-color);
            border: var(--border-width) solid var(--text-color);
            position: relative;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(-20px) skewX(-10deg);
            transition: opacity 0.4s, transform 0.4s;
        }

        .street-container.visible {
            opacity: 1;
            transform: translateY(0) skewX(0deg);
        }

        /* Zone Image */
        .art-box {
            width: var(--height);
            height: 100%;
            flex-shrink: 0;
            border-right: var(--border-width) solid var(--text-color);
            position: relative;
            overflow: hidden;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.3s;
        }
        

        /* Zone Texte */
        .marquee-wrapper {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-color);
        }

        .marquee-content {
            display: flex;
            white-space: nowrap;
            animation-name: scroll-left; 
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform;
        }

        .track-item {
            font-size: 3.5rem;
            line-height: 1;
            font-weight: 600;
            margin-right: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-color);
        }

        .outline {
            color: transparent;
            -webkit-text-stroke: 1px var(--text-color);
            font-weight: 400;
        }
        
        .separator { color: var(--accent-color); margin: 0 10px; }

        /* Barre de progression */
        .progress-bar-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            z-index: 10;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 1s linear;
        }

        /* Animation Scroll */
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Badge REC */
        .badge {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 14px; /* Un peu plus grand pour lisibilité */
            background: var(--text-color);
            color: var(--bg-color);
            padding: 0 6px;
            font-weight: 600;
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Point rouge clignotant */
        .rec-dot {
            color: var(--rec-color);
            font-size: 1.2em;
            line-height: 0; /* Centre verticalement */
            animation: blink-red 1s infinite; /* Clignote toujours */
        }

        @keyframes blink-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* État Pause (Général) */
        .street-container.paused .cover-img { filter: grayscale(0%); opacity: 0.5; }
        .street-container.paused .marquee-content { animation-play-state: paused; }
        
        /* Quand en pause, le point rouge s'arrête de clignoter et devient gris */
        .street-container.paused .rec-dot {
            animation: none;
            color: #555;
            opacity: 1;
        }

    </style>
</head>
<body>

    <div id="street-container" class="street-container">
        <div class="progress-bar-bg"><div id="prog" class="progress-fill"></div></div>
        <div class="art-box"><img id="art" class="cover-img" src="" alt=""></div>
        <div class="marquee-wrapper">
            <div id="marquee-inner" class="marquee-content"></div>
        </div>
        
        <div class="badge">
            REC <span class="rec-dot">●</span>
        </div>
    </div>

    <script>
        const API_URL = '/api/current-track';
        const REFRESH_RATE = 1000;
        const SCROLL_SPEED = 35; // Vitesse modifiable ici (secondes)

        const container = document.getElementById('street-container');
        const artImg = document.getElementById('art');
        const marqueeInner = document.getElementById('marquee-inner');
        const progEl = document.getElementById('prog');

        // Application vitesse
        marqueeInner.style.animationDuration = `${SCROLL_SPEED}s`;

        let lastCoverUrl = "";
        let lastTitle = "";
        let lastArtist = "";

        async function updateTrackInfo() {
            try {
                const response = await fetch(`${API_URL}?t=${Date.now()}`);
                if (!response.ok) throw new Error("API unreachable");
                const data = await response.json();

                if (!data || !data.title) {
                    container.classList.remove('visible');
                    return;
                } else {
                    container.classList.add('visible');
                }

                if (data.thumbnail && data.thumbnail !== lastCoverUrl) {
                    lastCoverUrl = data.thumbnail;
                    artImg.src = data.thumbnail;
                }

                if (data.title !== lastTitle || data.artist !== lastArtist) {
                    lastTitle = data.title;
                    lastArtist = data.artist;
                    
                    marqueeInner.innerHTML = '';
                    const textContent = `${data.title} <span class="separator">//</span> ${data.artist}`;
                    
                    let htmlContent = '';
                    for (let i = 0; i < 2; i++) {
                        htmlContent += `<div class="track-item">${textContent}</div>`;
                        htmlContent += `<div class="track-item outline">${textContent}</div>`;
                    }
                    marqueeInner.innerHTML = htmlContent;
                }

                if (data.is_playing) {
                    container.classList.remove('paused');
                } else {
                    container.classList.add('paused');
                }

                const currentSec = data.position || 0;
                const totalSec = data.duration || 1;
                const percent = (currentSec / totalSec) * 100;
                progEl.style.width = `${Math.min(percent, 100)}%`;

            } catch (error) {
                console.error("Error:", error);
            }
        }

        setInterval(updateTrackInfo, REFRESH_RATE);
        updateTrackInfo();
    </script>
</body>
</html>
